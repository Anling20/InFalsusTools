name: 'Package snapshot'
on:
  push:
    paths-ignore:
    - 'README.md'
permissions:
  contents: 'write'
jobs:
  package:
    runs-on: '${{ matrix.os }}'
    env:
      GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
      VERSION: '${{ github.ref_name }}'
      CHANNEL: 'alpha'
      RELEASE_TYPE: 'prerelease'
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: 'windows-latest'
          arch: 'amd64'
        - os: 'windows-11-arm'
          arch: 'arm64'
          node-version: '22'
    steps:
    - id: 'step-0'
      uses: 'actions/checkout@v7'
    - id: 'step-1'
      uses: 'NucleusFramework/Nucleus/.github/actions/setup-nucleus@main'
      with:
        java-version: '25'
        flatpak: 'true'
        snap: 'true'
        graalvm: 'true'
        node-version: '${{ matrix.node-version || ''24'' }}'
    - id: 'step-2'
      run: |-
        chmod +x ./gradlew
        ./gradlew :generateComposeResClass
        ./gradlew :generateResourceAccessorsForCommonMain
        ./gradlew :generateExpectResourceCollectorsForCommonMain
        ./gradlew :generateActualResourceCollectorsForJvmMain
        ./gradlew :assembleJvmMainResources
        ./gradlew :packageReleaseDistributionForCurrentOS --stacktrace --no-daemon
    - id: 'step-3'
      uses: 'actions/upload-artifact@v7'
      with:
        name: 'release-assets-${{ runner.os }}-${{ matrix.arch }}'
        path: 'build/compose/binaries/main/**/*'
    - id: 'step-4'
      uses: 'NucleusFramework/Nucleus/.github/actions/generate-update-yml@main'
      with:
        artifacts-path: 'artifacts'
        version: '${{ env.VERSION }}'
        channel: '${{ env.CHANNEL }}'
    - id: 'step-5'
      uses: 'NucleusFramework/Nucleus/.github/actions/publish-release@main'
      with:
        artifacts-path: 'artifacts'
        tag: '${{ env.TAG }}'
        release-type: '${{ env.RELEASE_TYPE }}'
