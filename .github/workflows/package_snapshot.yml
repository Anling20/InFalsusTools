name: 'Package snapshot'
on:
  push:
    paths-ignore:
    - 'README.md'
jobs:
  package-windows-amd64:
    runs-on: 'windows-latest'
    permissions:
      contents: 'read'
      packages: 'write'
    steps:
    - id: 'step-0'
      uses: 'actions/checkout@v7'
    - id: 'step-1'
      uses: 'actions/setup-java@v6'
      with:
        java-version: '25'
        distribution: 'zulu'
    - id: 'step-2'
      uses: 'gradle/actions/setup-gradle@v6'
    - id: 'step-3'
      run: |-
        chmod +x ./gradlew
        ./gradlew :generateComposeResClass
        ./gradlew :generateResourceAccessorsForCommonMain
        ./gradlew :generateExpectResourceCollectorsForCommonMain
        ./gradlew :generateActualResourceCollectorsForJvmMain
        ./gradlew :assembleJvmMainResources
    - id: 'step-4'
      name: 'package windows-portable-amd64'
      run: './gradlew :packageAppImage'
    - id: 'step-5'
      uses: 'actions/upload-artifact@v7'
      with:
        name: 'InFalsusTools-windows-portable-amd64'
        path: 'build/compose/binaries/main/app/*'
  package-windows-aarch64:
    runs-on: 'windows-11-arm'
    permissions:
      contents: 'read'
      packages: 'write'
    steps:
    - id: 'step-0'
      uses: 'actions/checkout@v7'
    - id: 'step-1'
      uses: 'actions/setup-java@v6'
      with:
        java-version: '25'
        distribution: 'zulu'
    - id: 'step-2'
      uses: 'gradle/actions/setup-gradle@v6'
    - id: 'step-3'
      run: |-
        chmod +x ./gradlew
        ./gradlew :generateComposeResClass
        ./gradlew :generateResourceAccessorsForCommonMain
        ./gradlew :generateExpectResourceCollectorsForCommonMain
        ./gradlew :generateActualResourceCollectorsForJvmMain
        ./gradlew :assembleJvmMainResources
    - id: 'step-4'
      name: 'package windows-portable-aarch64'
      run: './gradlew :packageAppImage'
    - id: 'step-5'
      uses: 'actions/upload-artifact@v7'
      with:
        name: 'InFalsusTools-windows-portable-aarch64'
        path: 'build/compose/binaries/main/app/*'
