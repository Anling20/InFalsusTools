name: 'Package'
on:
  push:
    paths-ignore:
    - 'README.md'
    tags:
    - 'v*'
permissions:
  contents: 'write'
concurrency:
  group: 'release-${{ github.ref }}'
  cancel-in-progress: false
jobs:
  validate-release-ref:
    runs-on: 'ubuntu-22.04'
    steps:
    - id: 'step-0'
      name: 'Checkout'
      uses: 'actions/checkout@v7'
      with:
        fetch-depth: '0'
    - id: 'step-1'
      name: 'Validate release ref'
      uses: 'NucleusFramework/Nucleus/.github/actions/validate-release-ref@main'
  build:
    runs-on: '${{ matrix.os }}'
    needs:
    - 'validate-release-ref'
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: 'windows-latest'
          arch: 'amd64'
        - os: 'windows-11-arm'
          arch: 'arm64'
          node-version: '22'
    steps:
    - id: 'step-0'
      name: 'Checkout'
      uses: 'actions/checkout@v7'
      with:
        fetch-depth: '0'
    - id: 'step-1'
      name: 'Determine version and channel'
      shell: 'bash'
      run: |-
        set -euo pipefail
        TAG="${GITHUB_REF_NAME}"
        VERSION="${TAG#v}"
        VERSION="${VERSION%%-*}"
        echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
    - id: 'step-2'
      name: 'Setup nucleus'
      uses: 'NucleusFramework/Nucleus/.github/actions/setup-nucleus@main'
      with:
        java-version: '25'
        flatpak: 'true'
        snap: 'true'
        graalvm: 'true'
        node-version: '${{ matrix.node-version || ''24'' }}'
    - id: 'step-3'
      name: 'Build'
      run: |-
        chmod +x ./gradlew
        ./gradlew :generateComposeResClass
        ./gradlew :generateResourceAccessorsForCommonMain
        ./gradlew :generateExpectResourceCollectorsForCommonMain
        ./gradlew :generateActualResourceCollectorsForJvmMain
        ./gradlew :assembleJvmMainResources
        ./gradlew :packageReleaseDistributionForCurrentOS --stacktrace --no-daemon
    - id: 'step-4'
      name: 'Upload artifacts'
      uses: 'actions/upload-artifact@v7'
      with:
        name: 'release-assets-${{ runner.os }}-${{ matrix.arch }}'
        path: |-
          !build/compose/binaries/**/app/**
          !build/compose/binaries/**/runtime/**
          build/compose/binaries/**/*.deb
          build/compose/binaries/**/*.rpm
          build/compose/binaries/**/*.asc
          build/compose/binaries/**/*.pacman
          build/compose/binaries/**/*.snap
          build/compose/binaries/**/*.flatpak
          build/compose/binaries/**/*.AppImage
          build/compose/binaries/**/*.appimage
          build/compose/binaries/**/*.msi
          build/compose/binaries/**/*.exe
          build/compose/binaries/**/*.appx
          build/compose/binaries/**/*.7z
          build/compose/binaries/**/*.pkg
          build/compose/binaries/**/*.dmg
          build/compose/binaries/**/*.zip
          build/compose/binaries/**/*.tar
          build/compose/binaries/**/*.tar.gz
          build/compose/binaries/**/*.blockmap
          build/compose/binaries/**/signing-metadata.json
          build/compose/binaries/**/packaging-metadata.json
          build/compose/binaries/sandboxed-*.zip
        if-no-files-found: 'error'
  publish:
    runs-on: 'ubuntu-22.04'
    needs:
    - 'build'
    env:
      GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
      GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
    steps:
    - id: 'step-0'
      name: 'Checkout'
      uses: 'actions/checkout@v7'
      with:
        fetch-depth: '0'
    - id: 'step-1'
      name: 'Download artifacts'
      uses: 'actions/download-artifact@v8'
      with:
        path: 'artifacts'
        pattern: 'release-assets-*'
    - id: 'step-2'
      name: 'Determine version and channel'
      shell: 'bash'
      run: |-
        set -euo pipefail
        TAG="${GITHUB_REF_NAME}"
        VERSION="${TAG#v}"
        VERSION="${VERSION%%-*}"
        echo "TAG=$TAG" >> "$GITHUB_ENV"
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"

        if [[ "$VERSION" == *"-alpha"* ]]; then
          echo "CHANNEL=alpha" >> "$GITHUB_ENV"
        elif [[ "$VERSION" == *"-beta"* ]]; then
          echo "CHANNEL=beta" >> "$GITHUB_ENV"
        else
          echo "CHANNEL=latest" >> "$GITHUB_ENV"
        fi

        if [[ "$VERSION" == *"-alpha"* ]] || [[ "$VERSION" == *"-beta"* ]]; then
          echo "RELEASE_TYPE=prerelease" >> "$GITHUB_ENV"
        else
          echo "RELEASE_TYPE=release" >> "$GITHUB_ENV"
        fi
    - id: 'step-3'
      name: 'List downloaded artifacts'
      shell: 'bash'
      run: 'find artifacts -type f | head -100'
    - id: 'step-4'
      name: 'Generate update YML files'
      uses: 'NucleusFramework/Nucleus/.github/actions/generate-update-yml@main'
      with:
        artifacts-path: 'artifacts'
        version: '${{ env.VERSION }}'
        channel: '${{ env.CHANNEL }}'
    - id: 'step-5'
      name: 'Show generated YML files'
      shell: 'bash'
      run: |-
        echo "=== Generated update YML files ==="
        for f in artifacts/update-yml/*.yml; do
          echo "--- $(basename "$f") ---"
          cat "$f"
          echo
        done
    - id: 'step-6'
      name: 'Publish release'
      uses: 'NucleusFramework/Nucleus/.github/actions/publish-release@main'
      with:
        artifacts-path: 'artifacts'
        tag: '${{ env.TAG }}'
        release-type: '${{ env.RELEASE_TYPE }}'
